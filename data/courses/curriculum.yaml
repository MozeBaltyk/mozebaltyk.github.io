# Course roadmap for the /courses/ pages.
#
# Every level repeats the same five familiar sections. `listed` controls links:
# all levels and sections remain visible in the roadmap. Lesson `status` records
# teaching history and is one of: done | current | todo.

for_parents:
  url: /courses/for-parents/
  title:
    en: For Parents
    pl: Dla rodziców
  text:
    en: Understand the course levels and how you can support your child.
    pl: Poznaj poziomy kursu i dowiedz się, jak wspierać swoje dziecko.

section_types:
  foundations:
    title:
      en: Foundations
      pl: Podstawy
  infrastructure:
    title:
      en: Infrastructure
      pl: Infrastruktura
  linux:
    title:
      en: Play with Linux
      pl: Zabawa z Linuksem
  programming:
    title:
      en: Programming
      pl: Programowanie
  challenges:
    title:
      en: Challenges
      pl: Wyzwania

levels:
  - id: level-1
    nav_weight: 1
    ages: 9–11
    listed: true
    url: /courses/level-1/
    title:
      en: Level 1
      pl: Poziom 1
    description:
      en: Discover how computers work through simple, practical projects.
      pl: Odkrywaj działanie komputerów dzięki prostym, praktycznym projektom.
    sections:
      - id: foundations
        listed: true
        url: /courses/level-1/foundations/
        lessons:
          - title:
              en: How Does a Computer Work?
              pl: Jak działa komputer?
            status: current
            url: /courses/level-1/foundations/how-computer-works/
          - title:
              en: Operating Systems
              pl: Systemy operacyjne
            status: todo
            url: /courses/level-1/foundations/operating-systems/
          - title:
              en: Why IT Matters
              pl: Dlaczego IT jest ważne
            status: todo
            url: /courses/level-1/foundations/stakes-of-it/
      - id: infrastructure
        listed: false
        url: /courses/level-1/infrastructure/
        lessons:
          - title:
              en: Server vs Cloud
              pl: Serwer a chmura
            status: todo
            url: /courses/level-1/infrastructure/server-vs-cloud/
          - title:
              en: "Networks: Switch and Router"
              pl: "Sieci: przełącznik i router"
            status: todo
            url: /courses/level-1/infrastructure/networks-switch-router/
          - title:
              en: "The Web: DNS and Certificates"
              pl: "Sieć WWW: DNS i certyfikaty"
            status: todo
            url: /courses/level-1/infrastructure/web/
      - id: linux
        listed: false
        url: /courses/level-1/linux/
        lessons:
          - title:
              en: Install and Boot Process
              pl: Proces instalacji i uruchamiania
            status: todo
            url: /courses/level-1/linux/install-and-boot/
          - title:
              en: Try a Linux Distribution
              pl: Wypróbuj dystrybucję Linuksa
            status: todo
            url: /courses/level-1/linux/distributions/
          - title:
              en: SSH Connection
              pl: Połączenie SSH
            status: todo
            url: /courses/level-1/linux/ssh/
          - title:
              en: RPM and DEB Packages
              pl: Pakiety RPM i DEB
            status: todo
            url: /courses/level-1/linux/rpm-and-deb/
      - id: programming
        listed: false
        url: /courses/level-1/programming/
        lessons:
          - title:
              en: Vim
              pl: Vim
            status: todo
            url: /courses/level-1/programming/vim/
          - title:
              en: Bash Basics
              pl: Podstawy Basha
            status: todo
            url: /courses/level-1/programming/bash-basics/
          - title:
              en: Git Versioning
              pl: Wersjonowanie z Gitem
            status: todo
            url: /courses/level-1/programming/git-versioning/
      - id: challenges
        listed: false
        url: /courses/level-1/challenges/
        lessons: []

  - id: level-2
    nav_weight: 2
    ages: 11–12
    listed: false
    url: /courses/level-2/
    title:
      en: Level 2
      pl: Poziom 2
    description:
      en: Build useful tools with Linux, networks, and code.
      pl: Buduj przydatne narzędzia z użyciem Linuksa, sieci i kodu.
    sections:
      - { id: foundations, listed: false, url: /courses/level-2/foundations/, lessons: [] }
      - { id: infrastructure, listed: false, url: /courses/level-2/infrastructure/, lessons: [] }
      - { id: linux, listed: false, url: /courses/level-2/linux/, lessons: [] }
      - { id: programming, listed: false, url: /courses/level-2/programming/, lessons: [] }
      - { id: challenges, listed: false, url: /courses/level-2/challenges/, lessons: [] }

  - id: level-3
    nav_weight: 3
    ages: 12–14
    listed: false
    url: /courses/level-3/
    title:
      en: Level 3
      pl: Poziom 3
    description:
      en: Connect and operate services using more advanced tools.
      pl: Łącz i obsługuj usługi za pomocą bardziej zaawansowanych narzędzi.
    sections:
      - { id: foundations, listed: false, url: /courses/level-3/foundations/, lessons: [] }
      - { id: infrastructure, listed: false, url: /courses/level-3/infrastructure/, lessons: [] }
      - { id: linux, listed: false, url: /courses/level-3/linux/, lessons: [] }
      - { id: programming, listed: false, url: /courses/level-3/programming/, lessons: [] }
      - { id: challenges, listed: false, url: /courses/level-3/challenges/, lessons: [] }

  - id: level-4
    nav_weight: 4
    ages: 14+
    listed: false
    url: /courses/level-4/
    title:
      en: Level 4
      pl: Poziom 4
    description:
      en: Design, automate, and operate complete reliable systems.
      pl: Projektuj, automatyzuj i obsługuj kompletne, niezawodne systemy.
    sections:
      - { id: foundations, listed: false, url: /courses/level-4/foundations/, lessons: [] }
      - { id: infrastructure, listed: false, url: /courses/level-4/infrastructure/, lessons: [] }
      - { id: linux, listed: false, url: /courses/level-4/linux/, lessons: [] }
      - { id: programming, listed: false, url: /courses/level-4/programming/, lessons: [] }
      - { id: challenges, listed: false, url: /courses/level-4/challenges/, lessons: [] }
