# Courses curriculum — single source of truth for the /courses/ homepage.
#
# Everything is bilingual via `{en, pl}` maps. `url` is a language-neutral
# path (without the /pl/ prefix); templates render it with `relLangURL`.
# `status` is one of: done | current | todo.
#
# ponytail: lesson titles and status live here (not duplicated in frontmatter),
# so the homepage progress/start/latest all read this one file.

for_parents:
  url: /courses/for-parents/
  title:
    en: For Parents
    pl: Dla rodziców
  text:
    en: Understand what your child will learn and how you can support him.
    pl: Dowiedz się, czego nauczy się Twoje dziecko i jak możesz je wspierać.

